[project]
name = "ythist"
version = "0.1.0"
description = "Scrape your YouTube watch history, store it in SQLite and get a terminal stats report"
readme = "README.md"
authors = [
    { name = "Omega", email = "96435033+omeg4-dev@users.noreply.github.com" }
]
requires-python = ">=3.13"
dependencies = [
    "playwright>=1.64.0",
    "rich>=15.0.0",
]

[project.scripts]
ythist = "ythist.cli:main"

[build-system]
requires = ["uv_build>=0.10.7,<0.11.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.0",
]
